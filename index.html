<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今日热量">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=12">
  <title>今日热量 · 摄入记录</title>
</head>
<body class="stats-active">
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">DAILY ENERGY</p>
        <h1>今天，吃了多少？</h1>
        <p class="date-line" id="today-label"></p>
      </div>
    </header>

    <main>
      <section id="stats-view" class="view stats-view">
        <div class="stats-toolbar">
          <button class="date-button" id="previous-day" type="button" aria-label="前一天">‹</button>
          <div class="date-picker-control">
            <div class="date-picker-button" aria-hidden="true">
              <strong id="stats-date-label"></strong>
              <span>点击选择日期</span>
            </div>
            <input id="stats-date-input" class="date-picker-native" type="date" aria-label="选择统计日期">
          </div>
          <button class="date-button" id="next-day" type="button" aria-label="后一天">›</button>
        </div>
        <div class="chart-card">
          <div class="chart-wrap" id="chart-wrap">
            <canvas id="calorie-chart" role="img" aria-label="当天0点至24点的热量柱状图"></canvas>
            <div class="chart-empty" id="chart-empty" hidden>这一天还没有热量记录</div>
            <div class="chart-tooltip bar-summary" id="chart-tooltip" hidden></div>
          </div>
        </div>
        <form class="quick-entry" id="quick-entry-form">
          <label class="unit-input">
            <span class="visually-hidden">热量数值</span>
            <input id="quick-calories" type="number" min="1" max="99999" inputmode="decimal" placeholder="输入热量">
            <span>kcal</span>
          </label>
          <button class="quick-save-button" id="quick-save-button" type="submit" disabled>记录</button>
        </form>
        <p class="chart-action-hint">保存时使用当前时间；长按柱子可修改热量、时间或删除。</p>
      </section>
    </main>
  </div>

  <dialog id="edit-record-dialog">
    <form method="dialog" id="edit-record-form">
      <div class="dialog-header">
        <div><p class="section-kicker">EDIT ENTRY</p><h2>编辑这条记录</h2></div>
        <button class="close-button" type="button" data-close-edit aria-label="关闭">×</button>
      </div>
      <p class="dialog-intro">修改后，柱状图会自动重新计算。</p>
      <div class="edit-fields calorie-edit-fields">
        <label>
          <span>热量</span>
          <span class="unit-input">
            <input id="edit-food-calories" type="number" min="1" max="99999" inputmode="decimal" required>
            <span>kcal</span>
          </span>
        </label>
        <label>
          <span>记录时间</span>
          <input id="edit-record-time" type="time" required>
        </label>
      </div>
      <div class="dialog-actions edit-dialog-actions">
        <button class="danger-button" id="delete-edit-record" type="button">删除</button>
        <button class="secondary-button" type="button" data-close-edit>取消</button>
        <button class="primary-button" type="submit">保存修改</button>
      </div>
    </form>
  </dialog>

  <dialog id="record-choice-dialog">
    <div class="choice-dialog-body">
      <div class="dialog-header">
        <div><p class="section-kicker">SELECT ENTRY</p><h2>选择要编辑的记录</h2></div>
        <button class="close-button" type="button" data-close-choice aria-label="关闭">×</button>
      </div>
      <p class="dialog-intro">这个时间区域有多次记录。</p>
      <div class="record-choice-list" id="record-choice-list"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=12"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
